<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .node-box { fill: #fff; stroke: #4a5568; stroke-width: 2; rx: 6; }
    .decision-line { stroke: #4a5568; stroke-width: 2; fill: none; }
    .decision-arrow { fill: #4a5568; }
    .cpu-node { fill: #ebf8ff; stroke: #3182ce; }
    .gpu-node { fill: #e6fffa; stroke: #38a169; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568" />
    </marker>
  </defs>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">GPU Decision Tree for Data Engineers</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">A practical checklist to determine if adding GPU hardware is worth the overhead.</text>

  <!-- Start Node -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="160" height="50" class="node-box" style="stroke: #dd6b20; stroke-width: 2.5;" />
    <text x="80" y="28" class="sketch-text" style="font-weight: bold; text-anchor: middle; fill: #dd6b20;">Start: Pipeline Stage</text>
  </g>

  <!-- Arrow to Question 1 -->
  <path d="M 400 150 L 400 180" class="decision-line" marker-end="url(#arrow)" />

  <!-- Question 1: Dataset Size -->
  <g transform="translate(250, 190)">
    <rect x="0" y="0" width="300" height="60" class="node-box" />
    <text x="150" y="28" class="sketch-text" style="font-weight: bold; text-anchor: middle;">Q1: Is dataset size &gt; 1M rows</text>
    <text x="150" y="45" class="sketch-text" style="text-anchor: middle; fill: #718096; font-size: 11px;">(Or size &gt; 100MB in memory?)</text>
  </g>

  <!-- Left: NO -> CPU -->
  <path d="M 250 220 L 160 220 L 160 260" class="decision-line" marker-end="url(#arrow)" />
  <text x="190" y="210" class="sketch-text" style="fill: #e53e3e; font-weight: bold;">NO</text>
  
  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="200" height="50" class="node-box cpu-node" />
    <text x="100" y="30" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; text-anchor: middle;">Stick to CPU (Pandas/Polars)</text>
  </g>

  <!-- Right: YES -> Q2 -->
  <path d="M 550 220 L 640 220 L 640 260" class="decision-line" marker-end="url(#arrow)" />
  <text x="610" y="210" class="sketch-text" style="fill: #38a169; font-weight: bold;">YES</text>

  <!-- Question 2: Math Complexity -->
  <g transform="translate(490, 270)">
    <rect x="0" y="0" width="300" height="60" class="node-box" />
    <text x="150" y="28" class="sketch-text" style="font-weight: bold; text-anchor: middle;">Q2: Is operation math-heavy?</text>
    <text x="150" y="45" class="sketch-text" style="text-anchor: middle; fill: #718096; font-size: 11px;">(Aggregations, matrix math, joins vs string regex)</text>
  </g>

  <!-- Q2 Left: NO -> CPU -->
  <path d="M 490 300 L 400 300 L 400 340" class="decision-line" marker-end="url(#arrow)" />
  <text x="440" y="290" class="sketch-text" style="fill: #e53e3e; font-weight: bold;">NO</text>
  
  <g transform="translate(300, 350)">
    <rect x="0" y="0" width="200" height="50" class="node-box cpu-node" />
    <text x="100" y="30" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; text-anchor: middle;">CPU (Spark/Polars)</text>
  </g>

  <!-- Q2 Right: YES -> GPU -->
  <path d="M 790 300 L 800 300 L 800 320 M 740 330 L 740 350" class="decision-line" marker-end="url(#arrow)" fill="none" />
  <path d="M 740 330 L 740 345" class="decision-line" marker-end="url(#arrow)" />
  <text x="755" y="342" class="sketch-text" style="fill: #38a169; font-weight: bold;">YES</text>

  <g transform="translate(540, 350)">
    <rect x="0" y="0" width="200" height="50" class="node-box gpu-node" />
    <text x="100" y="30" class="sketch-text" style="font-weight: bold; fill: #276749; text-anchor: middle;">Accelerate via GPU! (cuDF)</text>
  </g>
</svg>
