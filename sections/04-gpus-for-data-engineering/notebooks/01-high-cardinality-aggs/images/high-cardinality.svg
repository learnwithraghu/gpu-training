<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13.5px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .box-border { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .cpu-color { fill: #ebf8ff; stroke: #3182ce; }
    .gpu-color { fill: #e6fffa; stroke: #38a169; }
  </style>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">High Cardinality Groupby-Aggregation</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">Why high cardinality keys bottleneck the CPU but saturate the GPU.</text>

  <!-- CPU Panel (Left) -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border cpu-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; text-anchor: middle; font-size: 16px;">Sequential Hashing (CPU)</text>

    <!-- Hashing buckets sequentially -->
    <g transform="translate(30, 60)">
      <!-- Key-Value pairs input -->
      <rect x="10" y="10" width="70" height="30" rx="3" fill="#fff" stroke="#4a5568" />
      <text x="45" y="30" class="sketch-text" style="text-anchor: middle; font-size: 11px;">user_1203</text>
      
      <rect x="10" y="50" width="70" height="30" rx="3" fill="#fff" stroke="#4a5568" />
      <text x="45" y="70" class="sketch-text" style="text-anchor: middle; font-size: 11px;">user_9841</text>
      
      <!-- Hashing function (single pathway) -->
      <path d="M 90 45 L 150 45" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow-blue)" />
      <text x="120" y="35" class="sketch-text" style="font-size: 10px; fill: #2b6cb0; text-anchor: middle;">Hash map</text>
      
      <!-- Output bucket list -->
      <rect x="170" y="25" width="70" height="40" rx="4" fill="#ebf8ff" stroke="#2b6cb0" stroke-dasharray="3 3;" />
      <text x="205" y="48" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #2b6cb0;">Bucket</text>
    </g>

    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #2c5282;">Single-thread Hash Collision</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">Creating hash tables with millions of</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">unique keys is slow on one core.</text>
  </g>

  <!-- GPU Panel (Right) -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border gpu-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #22543d; text-anchor: middle; font-size: 16px;">Parallel Hash Aggregation (GPU)</text>

    <!-- Multi path hashing -->
    <g transform="translate(20, 60)">
      <!-- Parallel keys -->
      <rect x="10" y="10" width="60" height="20" rx="2" fill="#fff" stroke="#38a169" />
      <rect x="10" y="40" width="60" height="20" rx="2" fill="#fff" stroke="#38a169" />
      <rect x="10" y="70" width="60" height="20" rx="2" fill="#fff" stroke="#38a169" />

      <!-- Multi parallel arrows -->
      <path d="M 80 20 L 170 20" stroke="#38a169" stroke-width="2" marker-end="url(#arrow-green)" />
      <path d="M 80 50 L 170 50" stroke="#38a169" stroke-width="2" marker-end="url(#arrow-green)" />
      <path d="M 80 80 L 170 80" stroke="#38a169" stroke-width="2" marker-end="url(#arrow-green)" />

      <!-- Parallel buckets -->
      <rect x="190" y="10" width="60" height="80" rx="4" fill="#e6fffa" stroke="#38a169" stroke-dasharray="2 2;" />
      <text x="220" y="35" class="sketch-text" style="text-anchor: middle; font-size: 10px; fill: #276749;">B1</text>
      <text x="220" y="55" class="sketch-text" style="text-anchor: middle; font-size: 10px; fill: #276749;">B2</text>
      <text x="220" y="75" class="sketch-text" style="text-anchor: middle; font-size: 10px; fill: #276749;">B3</text>
    </g>

    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #276749;">Multi-threaded Hash Maps</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">Splits hash table creation across</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">thousands of execution threads.</text>
  </g>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3182ce" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38a169" />
    </marker>
  </defs>
</svg>
