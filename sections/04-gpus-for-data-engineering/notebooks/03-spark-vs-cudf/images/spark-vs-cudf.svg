<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13.5px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .box-border { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .spark-color { fill: #fffaf0; stroke: #dd6b20; }
    .cudf-color { fill: #e6fffa; stroke: #38a169; }
    .network-line { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 4 3; }
  </style>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">Spark on GPU vs. cuDF (RAPIDS)</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">Choosing the right architectural strategy: Multi-node cluster vs. Single-node raw speed.</text>

  <!-- Spark Panel (Left) -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border spark-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #dd6b20; text-anchor: middle; font-size: 16px;">Spark (Horizontal Scale-Out)</text>

    <!-- Cluster nodes drawing -->
    <g transform="translate(45, 55)">
      <!-- Master Node -->
      <rect x="70" y="0" width="80" height="30" rx="3" fill="#fff" stroke="#dd6b20" stroke-width="1.5" />
      <text x="110" y="20" class="sketch-text" style="text-anchor: middle; font-size: 10px; font-weight: bold;">Driver</text>

      <!-- Worker Nodes -->
      <rect x="10" y="60" width="50" height="25" rx="3" fill="#fff" stroke="#4a5568" />
      <text x="35" y="77" class="sketch-text" style="text-anchor: middle; font-size: 9px;">Worker 1</text>

      <rect x="85" y="60" width="50" height="25" rx="3" fill="#fff" stroke="#4a5568" />
      <text x="110" y="77" class="sketch-text" style="text-anchor: middle; font-size: 9px;">Worker 2</text>

      <rect x="160" y="60" width="50" height="25" rx="3" fill="#fff" stroke="#4a5568" />
      <text x="185" y="77" class="sketch-text" style="text-anchor: middle; font-size: 9px;">Worker 3</text>

      <!-- Connection lines -->
      <line x1="110" y1="30" x2="35" y2="60" class="network-line" />
      <line x1="110" y1="30" x2="110" y2="60" class="network-line" />
      <line x1="110" y1="30" x2="185" y2="60" class="network-line" />
    </g>

    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #c05621;">Best for Petabytes of Data</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">Uses multiple servers. High network</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">coordination overhead, but scales forever.</text>
  </g>

  <!-- cuDF Panel (Right) -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border cudf-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #22543d; text-anchor: middle; font-size: 16px;">cuDF (Single-Node Scale-Up)</text>

    <!-- Single heavy GPU machine drawing -->
    <g transform="translate(65, 55)">
      <!-- Server Box -->
      <rect x="0" y="0" width="180" height="90" rx="6" fill="#fff" stroke="#38a169" stroke-width="2" />
      <text x="90" y="25" class="sketch-text" style="font-weight: bold; fill: #276749; text-anchor: middle;">1 Core Server</text>
      
      <!-- GPU slots -->
      <rect x="20" y="45" width="140" height="30" rx="3" fill="#e6fffa" stroke="#38a169" stroke-width="1.5" />
      <text x="90" y="65" class="sketch-text" style="font-size: 10px; font-weight: bold; fill: #22543d; text-anchor: middle;">Tesla T4 GPU (Local VRAM)</text>
    </g>

    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #276749;">Best for Gigabytes of Data</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">No network overhead. Fits all data</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">directly into GPU VRAM for raw speed.</text>
  </g>
</svg>
