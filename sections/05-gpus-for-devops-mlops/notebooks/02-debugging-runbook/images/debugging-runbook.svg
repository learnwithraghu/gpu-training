<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .box-border { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .tool-box { fill: #fffaf0; stroke: #dd6b20; stroke-width: 2; rx: 6; }
  </style>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">The GPU Debugging Runbook</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">Three high-leverage tools to resolve the most common user issues in production.</text>

  <!-- Tool 1: nvidia-smi -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="200" height="250" class="box-border tool-box" />
    <text x="100" y="35" class="sketch-text" style="font-weight: bold; fill: #dd6b20; text-anchor: middle; font-size: 15px;">1. nvidia-smi</text>
    
    <!-- Monitor icon representation -->
    <rect x="50" y="60" width="100" height="60" rx="3" fill="#fff" stroke="#4a5568" stroke-width="1.5" />
    <line x1="100" y1="120" x2="100" y2="140" stroke="#4a5568" stroke-width="2" />
    <line x1="80" y1="140" x2="120" y2="140" stroke="#4a5568" stroke-width="2" />
    <text x="100" y="95" class="sketch-text" style="text-anchor: middle; font-size: 9px; fill: #e53e3e; font-weight: bold;">GPU 82% | 12GB</text>

    <text x="100" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold;">Observability</text>
    <text x="100" y="205" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #4a5568;">Check active PIDs,</text>
    <text x="100" y="222" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #4a5568;">VRAM, and power draw.</text>
  </g>

  <!-- Tool 2: empty_cache() -->
  <g transform="translate(300, 110)">
    <rect x="0" y="0" width="200" height="250" class="box-border tool-box" />
    <text x="100" y="35" class="sketch-text" style="font-weight: bold; fill: #dd6b20; text-anchor: middle; font-size: 15px;">2. empty_cache()</text>

    <!-- Broom icon -->
    <path d="M 80 120 L 120 70 M 70 130 L 95 110" stroke="#4a5568" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Dust elements -->
    <circle cx="65" cy="140" r="2" fill="#dd6b20" />
    <circle cx="75" cy="145" r="3" fill="#dd6b20" />
    <circle cx="85" cy="138" r="1.5" fill="#dd6b20" />

    <text x="100" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold;">Memory Clean</text>
    <text x="100" y="205" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #4a5568;">Reclaim fragmented</text>
    <text x="100" y="222" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #4a5568;">VRAM gaps without reset.</text>
  </g>

  <!-- Tool 3: Device Mapping -->
  <g transform="translate(540, 110)">
    <rect x="0" y="0" width="200" height="250" class="box-border tool-box" />
    <text x="100" y="35" class="sketch-text" style="font-weight: bold; fill: #dd6b20; text-anchor: middle; font-size: 15px;">3. Device Align</text>

    <!-- Connected nodes -->
    <circle cx="70" cy="90" r="12" fill="#fff" stroke="#3182ce" stroke-width="2" />
    <text x="70" y="94" class="sketch-text" style="text-anchor: middle; font-size: 9px; font-weight: bold; fill: #3182ce;">cuda:0</text>

    <circle cx="130" cy="90" r="12" fill="#fff" stroke="#38a169" stroke-width="2" />
    <text x="130" y="94" class="sketch-text" style="text-anchor: middle; font-size: 9px; font-weight: bold; fill: #38a169;">cuda:0</text>

    <path d="M 85 90 L 115 90" stroke="#38a169" stroke-width="2.5" stroke-dasharray="2 2" />

    <text x="100" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold;">Device Alignment</text>
    <text x="100" y="205" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #4a5568;">Ensure both model &amp;</text>
    <text x="100" y="222" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #4a5568;">tensors sit on same GPU.</text>
  </g>
</svg>
