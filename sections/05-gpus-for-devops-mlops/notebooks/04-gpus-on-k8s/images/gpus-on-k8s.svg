<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13.5px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .box-border { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .k8s-pod { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2; rx: 5; }
    .gpu-card { fill: #e6fffa; stroke: #38a169; stroke-width: 2.5; rx: 6; }
    .arrow-line { stroke: #dd6b20; stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dd6b20" />
    </marker>
  </defs>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">Kubernetes GPU Orchestration</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">How container environments assign and slice GPU hardware for microservices.</text>

  <!-- Left: K8s Pods -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="260" height="250" class="box-border" style="stroke: #3182ce; fill: #f0f8ff;" />
    <text x="130" y="30" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; text-anchor: middle; font-size: 15px;">Kubernetes Pods</text>

    <!-- Pod 1 -->
    <rect x="25" y="60" width="210" height="60" class="k8s-pod" />
    <text x="35" y="80" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; font-size: 11px;">Pod A: Inference Service</text>
    <text x="35" y="100" class="sketch-text" style="font-size: 10px; fill: #4a5568;">resources.limits: nvidia.com/gpu: 1</text>

    <!-- Pod 2 -->
    <rect x="25" y="145" width="210" height="60" class="k8s-pod" />
    <text x="35" y="165" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; font-size: 11px;">Pod B: Training Job</text>
    <text x="35" y="185" class="sketch-text" style="font-size: 10px; fill: #4a5568;">resources.limits: nvidia.com/gpu: 1</text>

    <text x="130" y="235" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #718096; font-style: italic;">Requests mapped by NVIDIA Device Plugin</text>
  </g>

  <!-- Connective arrows -->
  <path d="M 330 180 L 430 180" class="arrow-line" marker-end="url(#arrow)" />
  <path d="M 330 250 L 430 250" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Right: Physical GPU Slicing -->
  <g transform="translate(460, 110)">
    <rect x="0" y="0" width="280" height="250" class="box-border gpu-card" />
    <text x="140" y="30" class="sketch-text" style="font-weight: bold; fill: #22543d; text-anchor: middle; font-size: 15px;">Physical GPU Card</text>

    <!-- Slicing / MIG visual -->
    <rect x="20" y="60" width="240" height="150" rx="4" fill="#fff" stroke="#38a169" stroke-width="1.8" />
    <line x1="140" y1="60" x2="140" y2="210" stroke="#38a169" stroke-width="1.8" stroke-dasharray="3 3" />
    
    <!-- Slice 1 -->
    <text x="80" y="120" class="sketch-text" style="font-weight: bold; fill: #276749; text-anchor: middle;">GPU Slice 1</text>
    <text x="80" y="145" class="sketch-text" style="font-size: 10px; fill: #718096; text-anchor: middle;">Assigned to Pod A</text>

    <!-- Slice 2 -->
    <text x="200" y="120" class="sketch-text" style="font-weight: bold; fill: #276749; text-anchor: middle;">GPU Slice 2</text>
    <text x="200" y="145" class="sketch-text" style="font-size: 10px; fill: #718096; text-anchor: middle;">Assigned to Pod B</text>

    <text x="140" y="235" class="sketch-text" style="text-anchor: middle; font-size: 11px; fill: #276749; font-weight: bold;">Multi-Instance GPU (MIG)</text>
  </g>
</svg>
