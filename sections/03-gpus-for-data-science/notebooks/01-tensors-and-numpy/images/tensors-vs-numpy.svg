<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13.5px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .box-border { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .numpy-color { fill: #fff5f5; stroke: #e53e3e; }
    .torch-color { fill: #e6fffa; stroke: #38a169; }
    .arrow-line { stroke: #dd6b20; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
  </style>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dd6b20" />
    </marker>
  </defs>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">NumPy Arrays vs. PyTorch Tensors</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">Why device-awareness makes tensors the foundation of deep learning.</text>

  <!-- NumPy Panel (Left) -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border numpy-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #c53030; text-anchor: middle; font-size: 16px;">NumPy Array</text>
    
    <!-- CPU RAM Box -->
    <rect x="30" y="60" width="250" height="80" rx="6" fill="#fff" stroke="#e53e3e" stroke-width="2" />
    <text x="155" y="90" class="sketch-text" style="font-weight: bold; fill: #9b2c2c; text-anchor: middle;">System RAM (CPU)</text>
    <text x="155" y="110" class="sketch-text" style="text-anchor: middle; fill: #718096; font-size: 11px;">[1.2, 3.4, 5.6, ...]</text>

    <!-- GPU Box with Red Cross -->
    <rect x="30" y="165" width="250" height="50" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" style="stroke-dasharray: 4 4;" />
    <text x="155" y="195" class="sketch-text" style="text-anchor: middle; fill: #a0aec0;">GPU VRAM ❌</text>
    
    <text x="155" y="240" class="sketch-text" style="text-anchor: middle; font-size: 12px; fill: #718096; font-style: italic;">Locked to CPU. Cannot run on GPU.</text>
  </g>

  <!-- PyTorch Tensor Panel (Right) -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border torch-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #22543d; text-anchor: middle; font-size: 16px;">PyTorch Tensor</text>

    <!-- Device selection CPU -->
    <rect x="30" y="60" width="250" height="55" rx="6" fill="#fff" stroke="#3182ce" stroke-width="2" />
    <text x="155" y="85" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; text-anchor: middle; font-size: 13px;">CPU RAM (device="cpu")</text>
    <text x="155" y="102" class="sketch-text" style="text-anchor: middle; fill: #718096; font-size: 10px;">Default placement</text>

    <!-- Device selection GPU -->
    <rect x="30" y="165" width="250" height="55" rx="6" fill="#fff" stroke="#38a169" stroke-width="2" />
    <text x="155" y="190" class="sketch-text" style="font-weight: bold; fill: #276749; text-anchor: middle; font-size: 13px;">GPU VRAM (device="cuda")</text>
    <text x="155" y="207" class="sketch-text" style="text-anchor: middle; fill: #718096; font-size: 10px;">Accelerated math</text>

    <!-- Transfer Arrow -->
    <path d="M 155 120 L 155 160" class="arrow-line" marker-end="url(#arrow-orange)" />
    <text x="170" y="145" class="sketch-text" style="fill: #dd6b20; font-size: 10px; font-weight: bold;">.to("cuda")</text>
  </g>
</svg>
