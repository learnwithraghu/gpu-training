<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13.5px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .box-border { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .pandas-color { fill: #fffaf0; stroke: #dd6b20; }
    .cudf-color { fill: #e6fffa; stroke: #38a169; }
    .flow-line { stroke: #4a5568; stroke-width: 2; fill: none; }
  </style>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">Pandas vs. cuDF (GPU DataFrame)</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">How RAPIDS cuDF runs Pandas API commands in parallel on the GPU.</text>

  <!-- Pandas Panel (Left) -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border pandas-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #dd6b20; text-anchor: middle; font-size: 16px;">Pandas (CPU)</text>
    
    <!-- Table representation -->
    <rect x="30" y="60" width="250" height="90" rx="4" fill="#fff" stroke="#dd6b20" stroke-width="1.8" />
    <!-- Table lines -->
    <line x1="30" y1="90" x2="280" y2="90" stroke="#dd6b20" />
    <line x1="30" y1="120" x2="280" y2="120" stroke="#dd6b20" />
    <line x1="110" y1="60" x2="110" y2="150" stroke="#dd6b20" />
    <line x1="190" y1="60" x2="190" y2="150" stroke="#dd6b20" />

    <!-- Processing Arrow (Sequential) -->
    <path d="M 50 75 Q 80 110 50 135" class="flow-line" stroke="#e53e3e" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <defs>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#e53e3e" />
      </marker>
    </defs>
    
    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #c05621;">Single CPU Core</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">Processes dataframe rows one-by-one.</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">Slow on large tables (Millions of rows).</text>
  </g>

  <!-- cuDF Panel (Right) -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border cudf-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #22543d; text-anchor: middle; font-size: 16px;">cuDF (GPU)</text>

    <!-- Table representation -->
    <rect x="30" y="60" width="250" height="90" rx="4" fill="#fff" stroke="#38a169" stroke-width="1.8" />
    <!-- Table lines -->
    <line x1="30" y1="90" x2="280" y2="90" stroke="#38a169" />
    <line x1="30" y1="120" x2="280" y2="120" stroke="#38a169" />
    <line x1="110" y1="60" x2="110" y2="150" stroke="#38a169" />
    <line x1="190" y1="60" x2="190" y2="150" stroke="#38a169" />

    <!-- Multi-Processing Arrows (Parallel) -->
    <line x1="60" y1="70" x2="60" y2="140" stroke="#38a169" stroke-width="2" marker-end="url(#arrow-green)" />
    <line x1="140" y1="70" x2="140" y2="140" stroke="#38a169" stroke-width="2" marker-end="url(#arrow-green)" />
    <line x1="220" y1="70" x2="220" y2="140" stroke="#38a169" stroke-width="2" marker-end="url(#arrow-green)" />
    <defs>
      <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38a169" />
      </marker>
    </defs>

    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #276749;">2,000+ CUDA Cores</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">Processes millions of rows simultaneously.</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">Identical Pandas API but 10x-100x faster!</text>
  </g>
</svg>
