<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13.5px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .box-border { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .sync-color { fill: #fff5f5; stroke: #e53e3e; }
    .async-color { fill: #e6fffa; stroke: #38a169; }
  </style>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">Sync vs. Async: The Coffee Shop Analogy</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">Why GPU operations run in the background (asynchronously) unless synchronized.</text>

  <!-- Synchronous Coffee Shop -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border sync-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #c53030; text-anchor: middle; font-size: 15px;">Synchronous (Blocking)</text>
    
    <!-- Drawing: Person standing at counter waiting -->
    <g transform="translate(45, 60)">
      <!-- Counter -->
      <line x1="0" y1="80" x2="220" y2="80" stroke="#4a5568" stroke-width="3" />
      <text x="175" y="70" class="sketch-text" style="font-size: 10px; font-weight: bold; fill: #718096;">Counter</text>
      <!-- Customer -->
      <circle cx="50" cy="40" r="15" fill="#fed7d7" stroke="#e53e3e" stroke-width="2" />
      <line x1="50" y1="55" x2="50" y2="80" stroke="#e53e3e" stroke-width="2" />
      <!-- Clock representing waiting -->
      <circle cx="110" cy="40" r="10" fill="none" stroke="#e53e3e" stroke-width="1.5" />
      <line x1="110" y1="40" x2="110" y2="34" stroke="#e53e3e" />
      <line x1="110" y1="40" x2="116" y2="40" stroke="#e53e3e" />
      <!-- Barista -->
      <circle cx="170" cy="40" r="15" fill="#cbd5e0" stroke="#718096" stroke-width="2" />
      <line x1="170" y1="55" x2="170" y2="80" stroke="#718096" stroke-width="2" />
    </g>

    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #9b2c2c;">Customer blocks the line!</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">You cannot do anything else until the</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">coffee is ready and handed to you.</text>
  </g>

  <!-- Asynchronous Coffee Shop -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="310" height="260" class="box-border async-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #22543d; text-anchor: middle; font-size: 15px;">Asynchronous (Non-Blocking)</text>

    <!-- Drawing: Person ordering, walking away with ticket, barista cooking in background -->
    <g transform="translate(45, 60)">
      <!-- Counter -->
      <line x1="0" y1="80" x2="220" y2="80" stroke="#4a5568" stroke-width="3" />
      <!-- Customer sitting/reading phone -->
      <circle cx="50" cy="40" r="15" fill="#c6f6d5" stroke="#38a169" stroke-width="2" />
      <line x1="50" y1="55" x2="50" y2="80" stroke="#38a169" stroke-width="2" />
      <!-- Ticket -->
      <rect x="75" y="35" width="20" height="12" fill="#fff" stroke="#38a169" />
      <text x="85" y="44" class="sketch-text" style="font-size: 8px; text-anchor: middle; fill: #276749;">#42</text>
      <!-- Barista preparing coffee -->
      <circle cx="170" cy="40" r="15" fill="#cbd5e0" stroke="#718096" stroke-width="2" />
      <line x1="170" y1="55" x2="170" y2="80" stroke="#718096" stroke-width="2" />
    </g>

    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #276749;">Order enqueued, customer moves on!</text>
    <text x="155" y="205" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">You order, get a ticket, and can read</text>
    <text x="155" y="222" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">a book while the barista makes it.</text>
  </g>
</svg>
