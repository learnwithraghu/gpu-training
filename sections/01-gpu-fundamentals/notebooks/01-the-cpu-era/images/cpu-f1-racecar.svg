<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 14px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .road-border { stroke: #4a5568; stroke-width: 3; fill: none; stroke-linecap: round; }
    .car-body { fill: #fed7d7; stroke: #e53e3e; stroke-width: 2.5; stroke-linejoin: round; }
    .car-wheel { fill: #2d3748; stroke: #1a202c; stroke-width: 2; }
  </style>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">The CPU Era: Single-Thread King</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">Analogy: CPU as a Formula 1 race car optimized for absolute speed on a single lane.</text>

  <!-- Road -->
  <line x1="80" y1="280" x2="720" y2="280" class="road-border" />
  <line x1="80" y1="180" x2="720" y2="180" class="road-border" style="stroke-dasharray: 8 6;" />
  <line x1="80" y1="300" x2="720" y2="300" class="road-border" style="stroke-width: 1.5;" />

  <!-- F1 Car Sketch -->
  <g transform="translate(280, 185)">
    <!-- Rear Wing -->
    <path d="M 10 25 L 10 5 L 30 5 L 30 25 Z" class="car-body" />
    <line x1="5" y1="5" x2="35" y2="5" stroke="#e53e3e" stroke-width="3" />

    <!-- Car Body -->
    <path d="M 30 25 L 80 25 Q 120 25 150 45 L 170 50 L 170 65 L 10 65 Z" class="car-body" />
    <!-- Helmet -->
    <circle cx="85" cy="20" r="10" fill="#f6e05e" stroke="#4a5568" stroke-width="1.5" />
    <text x="85" y="24" class="sketch-text" style="font-size: 8px; text-anchor: middle; fill: #2d3748; font-weight: bold;">CHEF</text>

    <!-- Wheels -->
    <circle cx="45" cy="65" r="16" class="car-wheel" />
    <circle cx="45" cy="65" r="6" fill="#fff" />
    <circle cx="140" cy="65" r="16" class="car-wheel" />
    <circle cx="140" cy="65" r="6" fill="#fff" />

    <!-- Speed Lines -->
    <line x1="-20" y1="40" x2="-5" y2="40" stroke="#718096" stroke-width="2" />
    <line x1="-35" y1="50" x2="-10" y2="50" stroke="#718096" stroke-width="2" />
    <line x1="-15" y1="60" x2="-5" y2="60" stroke="#718096" stroke-width="2" />
  </g>

  <!-- Labels -->
  <text x="380" y="325" class="sketch-text" style="font-weight: bold; text-anchor: middle; fill: #e53e3e; font-size: 15px;">F1 Car (CPU Core)</text>
  <text x="380" y="345" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Runs at GHz speed (3-5 billion steps/second)</text>
  <text x="380" y="362" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Solves one complex recipe (thread) at a time</text>
  
  <text x="640" y="150" class="sketch-text" style="fill: #718096; font-style: italic;">Single-Lane Road</text>
</svg>
