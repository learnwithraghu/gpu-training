<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" style="background-color: #faf8f5; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Chalkboard SE', 'Chalkboard', 'Comic Neue', 'Comic Sans MS', sans-serif; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
  <style>
    .sketch-text { fill: #2d3748; font-size: 13.5px; }
    .title-text { fill: #1a202c; font-size: 20px; font-weight: bold; }
    .panel-box { fill: none; stroke: #4a5568; stroke-width: 2.5; rx: 8; stroke-linejoin: round; }
    .prof-color { fill: #ebf8ff; stroke: #3182ce; }
    .kid-color { fill: #e6fffa; stroke: #38a169; }
  </style>

  <!-- Faint grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0ece4" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title -->
  <text x="40" y="45" class="title-text">CPU vs. GPU: Professor vs. Assistants</text>
  <text x="40" y="70" class="sketch-text" style="font-style: italic; fill: #4a5568;">The difference in execution style: specialized complexity vs. raw massive count.</text>

  <!-- CPU Panel -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="310" height="280" class="panel-box prof-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #2b6cb0; text-anchor: middle; font-size: 16px;">CPU: The Math Professor</text>

    <!-- Professor Icon Drawing (Simple head with glasses) -->
    <g transform="translate(125, 60)">
      <circle cx="30" cy="30" r="25" fill="#bee3f8" stroke="#3182ce" stroke-width="2" />
      <rect x="12" y="20" width="15" height="10" rx="2" fill="none" stroke="#2b6cb0" stroke-width="1.5" />
      <rect x="33" y="20" width="15" height="10" rx="2" fill="none" stroke="#2b6cb0" stroke-width="1.5" />
      <line x1="27" y1="25" x2="33" y2="25" stroke="#2b6cb0" stroke-width="1.5" />
      <!-- Mouth (Smiling) -->
      <path d="M 20 40 Q 30 48 40 40" fill="none" stroke="#2b6cb0" stroke-width="1.5" />
      <!-- Graduation Hat -->
      <path d="M 5 10 L 30 -5 L 55 10 L 30 20 Z" fill="#2d3748" stroke="#1a202c" stroke-width="1.5" />
      <line x1="30" y1="20" x2="30" y2="3" stroke="#2d3748" />
    </g>

    <!-- Description -->
    <text x="155" y="150" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #2c5282;">1 Heavyweight Core</text>
    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Highly smart and flexible</text>
    <text x="155" y="200" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Can calculate anything (logic, branches)</text>
    <text x="155" y="220" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Does work one step at a time</text>
    <text x="155" y="250" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #2b6cb0; font-size: 14px;">Goal: Solve 1 Hard Task Fast (Latency)</text>
  </g>

  <!-- GPU Panel -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="310" height="280" class="panel-box kid-color" />
    <text x="155" y="30" class="sketch-text" style="font-weight: bold; fill: #22543d; text-anchor: middle; font-size: 16px;">GPU: 10,000 Assistants</text>

    <!-- Simple kids head drawing -->
    <g transform="translate(30, 50)">
      <!-- Kid 1 -->
      <circle cx="20" cy="20" r="14" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5" />
      <path d="M 14 25 Q 20 30 26 25" fill="none" stroke="#276749" stroke-width="1" />
      
      <!-- Kid 2 -->
      <circle cx="60" cy="20" r="14" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5" />
      <path d="M 54 25 Q 60 30 66 25" fill="none" stroke="#276749" stroke-width="1" />

      <!-- Kid 3 -->
      <circle cx="100" cy="20" r="14" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5" />
      <path d="M 94 25 Q 100 30 106 25" fill="none" stroke="#276749" stroke-width="1" />

      <!-- Kid 4 -->
      <circle cx="140" cy="20" r="14" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5" />
      <path d="M 134 25 Q 140 30 146 25" fill="none" stroke="#276749" stroke-width="1" />

      <!-- Kid 5 -->
      <circle cx="180" cy="20" r="14" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5" />
      <path d="M 174 25 Q 180 30 186 25" fill="none" stroke="#276749" stroke-width="1" />

      <!-- Kid 6 -->
      <circle cx="220" cy="20" r="14" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5" />
      <path d="M 214 25 Q 220 30 226 25" fill="none" stroke="#276749" stroke-width="1" />
    </g>

    <!-- Description -->
    <text x="155" y="150" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #22543d;">Thousands of Simple ALUs</text>
    <text x="155" y="180" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Not very flexible (no branch prediction)</text>
    <text x="155" y="200" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Can only do simple math (multiply, add)</text>
    <text x="155" y="220" class="sketch-text" style="text-anchor: middle; fill: #4a5568;">- Everyone works at the exact same time</text>
    <text x="155" y="250" class="sketch-text" style="text-anchor: middle; font-weight: bold; fill: #22543d; font-size: 14px;">Goal: Solve 10,000 Easy Tasks (Throughput)</text>
  </g>
</svg>
